[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirextalk-plugins"
version = "0.1.0"
description = "Official Dirextalk plugin runtime and Agent plugin"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "pydantic>=2.11",
  "uvicorn>=0.35",
  "websockets>=11"
]

[project.optional-dependencies]
agent = [
  "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.4.0"
]
ops = []
knowledge = [
  "lancedb>=0.34",
  "psycopg[binary]>=3.2"
]
test = [
  "lancedb>=0.34",
  "psycopg[binary]>=3.2",
  "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.4.0",
  "pytest>=8.4",
  "pytest-asyncio>=0.25"
]

[tool.setuptools.packages.find]
where = ["runtime/python", "plugins/agent", "plugins/ops"]

[tool.pytest.ini_options]
testpaths = ["plugins/agent/tests", "plugins/ops/tests"]
asyncio_mode = "auto"
