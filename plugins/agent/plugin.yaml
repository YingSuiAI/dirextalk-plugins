id: io.dirextalk.agent
name: Dirextalk Agent
version: 0.1.0
description: Official Dirextalk Agent plugin using Pydantic AI-compatible runtime with skills, MCP, and optional knowledge base.
min_base_version: 0.1.0
runtime:
  type: docker
  image: docker.io/dirextalk/agent-plugin:latest
  digest: ""
service:
  protocol: http
  health: /health
  invoke: /invoke
permissions:
  - matrix.messages.read
  - matrix.messages.send
  - rooms.members.read
  - mcp.call
  - skills.install
  - knowledge.read
  - knowledge.write
events:
  - message.created
  - agent.mentioned
actions:
  - agent.chat
  - agent.chat.stream
  - agent.context.compress
  - agent.models.list
  - agent.skills.list
  - agent.skills.registry.search
  - agent.mcp.servers.list
  - agent.mcp.registry.search
  - agent.knowledge.config.get
  - agent.knowledge.config.update
  - agent.knowledge.sources.list
  - agent.knowledge.sources.delete
  - agent.knowledge.upload.start
  - agent.knowledge.upload.chunk
  - agent.knowledge.upload.finish
  - agent.knowledge.memory.create
  - agent.knowledge.search
  - agent.knowledge.status
  - agent.config.propose_patch
  - agent.contacts.list
  - agent.contacts.search
  - agent.rooms.search
  - agent.messages.list
  - agent.messages.send
  - agent.summarize
config_schema:
  provider:
    type: enum
    values: [openai, anthropic, deepseek, gemini, vertex, openai_compatible, openrouter, litellm]
  model:
    type: string
  base_url:
    type: string
  skills_registry_url:
    type: string
  mcp_registry_url:
    type: string
  knowledge:
    type: object
    properties:
      enabled:
        type: boolean
      embedding_profile:
        type: request-local
      ocr_profile:
        type: request-local
      vector_index:
        type: enum
        values: [lancedb]
      metadata_store:
        type: enum
        values: [postgres, sqlite_fallback]
