id: io.dirextalk.agent
name: Dirextalk Agent
version: 0.1.0
description: Official Dirextalk Agent plugin using Pydantic AI-compatible runtime.
min_base_version: 0.1.0
runtime:
  type: docker
  image: docker.io/dirextalk/agent-plugin:latest
  digest: ""
service:
  protocol: http
  health: /health
  invoke: /invoke
permissions:
  - matrix.messages.read
  - matrix.messages.send
  - rooms.members.read
  - mcp.call
  - skills.install
events:
  - message.created
  - agent.mentioned
actions:
  - agent.chat
  - agent.chat.stream
  - agent.models.list
  - agent.skills.list
  - agent.skills.registry.search
  - agent.mcp.servers.list
  - agent.mcp.registry.search
  - agent.config.propose_patch
  - agent.contacts.list
  - agent.contacts.search
  - agent.rooms.search
  - agent.messages.list
  - agent.messages.send
  - agent.summarize
config_schema:
  provider:
    type: enum
    values: [openai, anthropic, deepseek, gemini, vertex, openai_compatible, openrouter, litellm]
  model:
    type: string
  api_key_ref:
    type: secret
  base_url:
    type: string
  skills_registry_url:
    type: string
  mcp_registry_url:
    type: string
